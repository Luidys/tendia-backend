<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tendia · Mini agente de IA para tu negocio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#FBF7EF;
    --paper-2:#F3EEE1;
    --ink:#182430;
    --ink-soft:#3A4654;
    --mango:#F2A93B;
    --mango-deep:#C97F19;
    --verde:#2F7A5E;
    --verde-deep:#1F5943;
    --verde-pale:#E4F0EA;
    --clay:#C1502E;
    --clay-pale:#FBE6DE;
    --slate:#6B7280;
    --line:#E4DCC9;
    --white:#FFFFFF;
    --radius:16px;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 500px at 50% 0%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 100%, #C9BC9E, transparent 70%),
      linear-gradient(180deg, #E6DCC2, #C9BC9E 60%, #B9AA88);
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:34px 10px 50px;
  }
  /* ---------- marco tipo teléfono ---------- */
  .phone{
    width:100%;
    max-width:428px;
    background:var(--paper);
    border-radius:34px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.5) inset,
      0 50px 80px -24px rgba(20,20,10,0.55),
      0 18px 30px -14px rgba(20,20,10,0.4),
      0 0 0 10px #16233A,
      0 0 0 11px #2a3648,
      0 0 0 13px #0e161f;
    overflow:hidden;
    position:relative;
    min-height:850px;
    display:flex;
    flex-direction:column;
    transform:perspective(1400px) rotateX(1.5deg);
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:#16233A; border-radius:0 0 14px 14px; z-index:50;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  .status{
    height:14px;
  }
  /* ---------- topbar ---------- */
  .topbar{
    padding:22px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #FFFDF8, var(--paper));
    position:relative; z-index:5;
    box-shadow:0 6px 14px -10px rgba(24,36,48,0.25);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(155deg, #3B9576, var(--verde) 45%, var(--verde-deep));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:var(--font-display); font-weight:700; font-size:17px;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.45),
      inset 0 -3px 6px rgba(0,0,0,0.18),
      0 6px 12px -4px rgba(31,89,67,0.55);
  }
  .brand-name{ font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:0.2px; }
  .brand-sub{ font-size:11px; color:var(--slate); margin-top:-2px; }
  .session-chip{
    font-size:11px; background:linear-gradient(180deg,#fff,var(--paper-2)); border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 10px; border-radius:100px; cursor:pointer; font-weight:600;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 2px 5px -2px rgba(24,36,48,.25);
  }
  /* ---------- contenido ---------- */
  .screen{ flex:1; overflow-y:auto; padding:18px 18px 90px; }
  .screen::-webkit-scrollbar{ display:none; }
  h1,h2,h3{ font-family:var(--font-display); margin:0 0 4px; }
  p{ margin:0; }
  .muted{ color:var(--slate); font-size:13px; }
  .eyebrow{
    text-transform:uppercase; letter-spacing:1.4px; font-size:10.5px; font-weight:700; color:var(--verde-deep);
  }

  /* ---------- login ---------- */
  .hero-login{
    padding:34px 26px 20px; text-align:center;
  }
  .hero-mark{
    width:78px;height:78px; margin:0 auto 14px;
    filter:drop-shadow(0 16px 22px rgba(193,80,46,0.4)) drop-shadow(0 4px 6px rgba(24,36,48,0.15));
  }
  .wordmark{ display:flex; align-items:baseline; justify-content:center; gap:2px; }
  .wordmark .tm{ font-size:10px; color:var(--slate); font-weight:700; align-self:flex-start; margin-top:2px; }
  .role-toggle{
    display:flex; background:var(--paper-2); border-radius:100px; padding:4px; margin:22px 18px 0; gap:4px;
  }
  .role-toggle button{
    flex:1; border:none; background:transparent; padding:11px 8px; border-radius:100px;
    font-family:var(--font-body); font-weight:700; font-size:13.5px; color:var(--slate); cursor:pointer;
    transition:all .15s ease;
  }
  .role-toggle button.active{ background:var(--ink); color:#fff; }
  .login-form{ padding:22px 18px 0; display:flex; flex-direction:column; gap:12px; }
  .field label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:12px 13px; border-radius:11px; border:1.5px solid var(--line);
    background:#fff; font-size:14px; font-family:var(--font-body); color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--mango); border-color:var(--mango); }
  .btn{
    border:none; border-radius:12px; padding:13px 16px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:var(--font-body); display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{ transform:translateY(1px) scale(0.99); }
  .btn:focus-visible{ outline:3px solid var(--mango-deep); outline-offset:2px; }
  .btn-primary{
    background:linear-gradient(180deg, #263950, var(--ink) 70%); color:#fff; width:100%;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 18px -8px rgba(24,36,48,.55);
  }
  .btn-primary:hover{ background:linear-gradient(180deg,#2c4159,#0e161f 70%); }
  .btn-verde{
    background:linear-gradient(180deg, #3B9576, var(--verde-deep)); color:#fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 16px -8px rgba(31,89,67,.65);
  }
  .btn-mango{
    background:linear-gradient(180deg, #FFC069, var(--mango-deep)); color:#3a2405;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 16px -8px rgba(201,127,25,.6);
  }
  .btn-outline{
    background:linear-gradient(180deg,#fff,var(--paper-2)); border:1.5px solid var(--line); color:var(--ink);
    box-shadow:0 2px 6px -3px rgba(24,36,48,.2);
  }
  .btn-sm{ padding:8px 12px; font-size:12.5px; border-radius:9px; }
  .demo-hint{ font-size:11.5px; color:var(--slate); text-align:center; margin-top:14px; }
  .demo-hint b{ color:var(--ink-soft); }

  /* ---------- receipt / signature card ---------- */
  .receipt{
    position:relative; background:linear-gradient(165deg,#fff,#FCFAF3); border-radius:6px; padding:20px 18px 16px;
    box-shadow: 0 16px 30px -18px rgba(24,36,48,.45), 0 4px 10px -6px rgba(24,36,48,.15);
  }
  .receipt::before, .receipt::after{
    content:""; position:absolute; left:0; right:0; height:9px;
    background-image: radial-gradient(circle at 8px 5px, #DDD3BE 5px, transparent 5.5px);
    background-size:16px 10px; background-repeat:repeat-x;
  }
  .receipt::before{ top:-5px; }
  .receipt::after{ bottom:-5px; transform:rotate(180deg); }
  .receipt .tear{ border-top:1.5px dashed var(--line); margin:12px 0; }

  /* ---------- kpi grid ---------- */
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .kpi{
    background:linear-gradient(165deg,#fff,#FCFAF3); border:1px solid rgba(228,220,201,.7); border-radius:13px; padding:13px 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 10px 20px -14px rgba(24,36,48,.35), 0 2px 5px -2px rgba(24,36,48,.08);
  }
  .kpi .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--slate); font-weight:700; }
  .kpi .val{ font-family:var(--font-mono); font-size:21px; font-weight:700; margin-top:4px; color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.6); }
  .kpi .delta{ font-size:11px; margin-top:3px; font-weight:600; }
  .delta.up{ color:var(--verde-deep); }
  .delta.down{ color:var(--clay); }

  .card{
    background:linear-gradient(165deg,#fff,#FCFAF3); border:1px solid rgba(228,220,201,.7); border-radius:14px; padding:16px; margin-top:14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 14px 26px -16px rgba(24,36,48,.4), 0 3px 8px -4px rgba(24,36,48,.1);
  }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-top:26px; margin-bottom:2px; }
  .section-title h2{ font-size:16.5px; }
  .link-btn{ background:none; border:none; color:var(--verde-deep); font-weight:700; font-size:12.5px; cursor:pointer; }

  canvas{ max-height:170px; }

  /* ---------- producto ---------- */
  .prod{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:flex-start;
  }
  .prod:last-child{ border-bottom:none; }
  .prod-thumb{
    width:52px; height:52px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(155deg, #FFC069, var(--mango) 45%, var(--clay)); display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--font-display); font-weight:700; font-size:18px;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5), inset 0 -3px 6px rgba(0,0,0,.15), 0 8px 14px -6px rgba(193,80,46,.5);
    overflow:hidden;
  }
  .prod-thumb img{ width:100%; height:100%; object-fit:cover; }
  .img-picker{ display:flex; gap:8px; }
  .img-picker label{
    flex:1; border:1.5px dashed var(--line); border-radius:11px; padding:10px; text-align:center;
    font-size:11.5px; color:var(--slate); cursor:pointer; position:relative; overflow:hidden; min-height:52px;
    display:flex; align-items:center; justify-content:center;
  }
  .img-picker label.tiene-imagen{ border-style:solid; padding:0; }
  .img-picker img{ width:100%; height:52px; object-fit:cover; border-radius:9px; }
  .img-picker input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .logo-picker{ display:flex; align-items:center; gap:12px; }
  .logo-preview{
    width:56px; height:56px; border-radius:14px; flex-shrink:0; overflow:hidden;
    background:linear-gradient(155deg, #FFC069, var(--mango) 45%, var(--clay));
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:20px;
  }
  .logo-preview img{ width:100%; height:100%; object-fit:cover; }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; border-radius:inherit; }
  .prod-info{ flex:1; min-width:0; }
  .prod-info .nm{ font-weight:700; font-size:14px; }
  .prod-info .cat{ font-size:11px; color:var(--slate); }
  .promo-tag{
    display:inline-block; margin-top:4px; background:var(--clay-pale); color:var(--clay); font-size:10.5px;
    font-weight:700; padding:2px 7px; border-radius:100px;
  }
  .price-block{ text-align:right; flex-shrink:0; }
  .price-now{ font-family:var(--font-mono); font-weight:700; font-size:14.5px; }
  .price-before{ font-family:var(--font-mono); font-size:11.5px; color:var(--slate); text-decoration:line-through; }
  .ahorro{ font-size:10.5px; color:var(--verde-deep); font-weight:700; }

  /* ---------- badges de estado ---------- */
  .badge{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:100px; }
  .badge.nuevo{ background:var(--verde-pale); color:var(--verde-deep); }
  .badge.proceso{ background:#FDF1DA; color:var(--mango-deep); }
  .badge.listo{ background:var(--verde-pale); color:var(--verde-deep); }
  .badge.entregado{ background:var(--paper-2); color:var(--slate); }

  /* ---------- toggle switch ---------- */
  .switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0; background:#D8D0BE; border-radius:100px; transition:.2s;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
  }
  .slider::before{
    content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;
    box-shadow:0 2px 4px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.4) inset;
  }
  .switch input:checked + .slider{ background:linear-gradient(180deg,#3B9576,var(--verde-deep)); }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  /* ---------- chat bubble sim ---------- */
  .chat-window{
    background:linear-gradient(165deg,#F2EADA,#E9DFC8); border-radius:14px; padding:14px; margin-top:12px;
    box-shadow:inset 0 2px 6px rgba(24,36,48,.08);
  }
  .bubble{ max-width:82%; padding:9px 12px; border-radius:14px; font-size:13px; margin-bottom:8px; line-height:1.4; }
  .bubble.in{ background:#fff; border-bottom-left-radius:4px; box-shadow:0 3px 8px -4px rgba(24,36,48,.25); }
  .bubble.out{
    background:linear-gradient(180deg,#3B9576,var(--verde-deep)); color:#fff; margin-left:auto; border-bottom-right-radius:4px;
    box-shadow:0 4px 10px -4px rgba(31,89,67,.55);
  }
  .chat-ch{ font-size:10.5px; color:var(--slate); text-align:center; margin-bottom:10px; }

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,#fff,#FDFBF5); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 22px -14px rgba(24,36,48,.35);
    z-index:10;
  }
  .navbtn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:9.5px; color:var(--slate); font-weight:600; cursor:pointer; padding:6px 1px; border-radius:10px;
    transition:transform .1s ease; min-width:0;
  }
  .navbtn:active{ transform:scale(0.94); }
  .navbtn.active{ color:var(--verde-deep); background:var(--verde-pale); box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
  .navbtn .ic{ width:20px; height:20px; }

  /* ---------- toast ---------- */
  .toast{
    position:absolute; left:16px; right:16px; bottom:78px; background:var(--ink); color:#fff; padding:12px 16px;
    border-radius:12px; font-size:12.5px; z-index:80; box-shadow:0 12px 24px rgba(0,0,0,.3);
    opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .empty{ text-align:center; padding:40px 20px; color:var(--slate); font-size:13px; }
  .empty .em-mark{ font-size:30px; margin-bottom:8px; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--slate); padding-bottom:8px; border-bottom:1px solid var(--line); }
  td{ padding:9px 0; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }

  .cart-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .qty{ display:flex; align-items:center; gap:8px; }
  .qty button{ width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:700; }

  ::selection{ background:var(--mango); color:#3a2405; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="status"></div>
  <div id="app"></div>
</div>

<script>


/* =========================================================================
   TENDIA — mini agente de IA para pequeños y medianos comercios
   Conectado al backend real (Node + Express + Prisma) vía fetch().
   ========================================================================= */

// Cambia esto por la URL de tu backend una vez lo despliegues
// (ej: "https://tendia-backend.up.railway.app"). Mientras tanto apunta a
// tu servidor local (npm run dev en la carpeta tendia-backend).
const API_URL = "http://localhost:4000";

const LOGO_SVG = `
<svg viewBox="0 0 64 64" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC069"/>
      <stop offset="45%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#C1502E"/>
    </linearGradient>
    <linearGradient id="awningGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE7D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#tileGrad)"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#glow)"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="#8C3719" stroke-opacity="0.25"/>
  <path d="M15 25 A6 6 0 0 1 27 25 A6 6 0 0 1 39 25 A6 6 0 0 1 51 25 L51 30 L15 30 Z" fill="url(#awningGrad)"/>
  <rect x="18" y="30" width="28" height="17" rx="2.5" fill="#FFFDF8" opacity="0.96"/>
  <rect x="29" y="37" width="6" height="10" rx="1" fill="#C1502E" opacity="0.85"/>
  <path d="M47 9 L49.6 14.2 L55 16.8 L49.6 19.4 L47 24.6 L44.4 19.4 L39 16.8 L44.4 14.2 Z" fill="#FFFDF8"/>
  <path d="M47 12.5 L48.6 15.7 L51.8 17.3 L48.6 18.9 L47 22.1 L45.4 18.9 L42.2 17.3 L45.4 15.7 Z" fill="#F2A93B"/>
</svg>`;

// El backend maneja TODOS los montos en centavos de USD (ej: $3,50 = 350),
// para evitar errores de redondeo. fmt() siempre recibe centavos.
const fmt = (centavos) => "$" + (Number(centavos || 0) / 100).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtBs = (centimos) => "Bs. " + (Number(centimos || 0) / 100).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDual = (centavosUsd, tasaBs) => tasaBs ? `${fmt(centavosUsd)} (≈ ${fmtBs(Math.round(centavosUsd * tasaBs))})` : fmt(centavosUsd);
const $app = document.getElementById("app");

/* ---------------------- estado en memoria ---------------------- */
const state = {
  token: null,
  usuario: null,       // {id, nombre, email, role, comercioId, telefono}
  comercioInfo: null,  // {id, nombre, categoria} del negocio del comerciante logueado
  role: null,           // 'comerciante' | 'cliente'
  view: null,
  authMode: "login",    // 'login' | 'registro' | 'recuperar-solicitar' | 'recuperar-cambiar'
  registroRole: "COMERCIANTE",
  recuperarEmail: null,
  recuperarToken: null,

  // pago de un pedido
  pedidoParaPagar: null,
  metodoPagoElegido: null,

  // cliente
  comercioActivo: null, // comercio que el cliente está explorando/comprando
  carrito: [],

  // edición en curso (menú del comerciante)
  mostrandoFormNuevoProducto: false,
  editandoProductoId: null,
  confirmarBorrarId: null,
};

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.getElementById("phone").appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3200);
}

/** Llama a la API real. Lanza un Error con el mensaje del backend si algo falla. */
async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  let resp;
  try {
    resp = await fetch(`${API_URL}${path}`, { ...options, headers });
  } catch (err) {
    throw new Error(`No se pudo conectar con el backend (${API_URL}). ¿Está corriendo?`);
  }
  let data = null;
  try { data = await resp.json(); } catch { /* respuestas sin cuerpo, ej. 204 */ }
  if (!resp.ok) throw new Error(data?.error || `Error ${resp.status}`);
  return data;
}

function cargando(msg = "Cargando…") {
  return `<div class="empty"><div class="em-mark">⏳</div>${msg}</div>`;
}
function errorBox(msg) {

        `}
      ` : ""}
      <div class="field"><label>Correo</label><input type="email" name="email" placeholder="tucorreo@ejemplo.com" required></div>
      <div class="field"><label>Contraseña</label><input type="password" name="password" placeholder="••••••••" minlength="6" required></div>
      <button class="btn btn-primary" type="submit" style="margin-top:6px;">${esRegistro ? "Crear cuenta" : "Entrar"}</button>

  });
  $app.querySelectorAll(".role-toggle button[data-rrole]").forEach((b) => {
    b.onclick = () => { state.registroRole = b.dataset.rrole; renderLogin(); };
  });
  const olvideBtn = document.getElementById("olvideBtn");
  if (olvideBtn) olvideBtn.onclick = () => { state.authMode = "recuperar-solicitar"; renderLogin(); };

  document.getElementById("authForm").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const boton = e.target.querySelector("button[type=submit]");
    boton.disabled = true; boton.textContent = "Un momento…";
    try {
      let data;
      if (esRegistro) {
        const payload = { role: state.registroRole, nombre: fd.get("nombre"), email: fd.get("email"), password: fd.get("password") };
        if (state.registroRole === "COMERCIANTE") { payload.comercioNombre = fd.get("comercioNombre"); payload.categoria = fd.get("categoria") || undefined; }
        else { payload.telefono = fd.get("telefono") || undefined; }
        data = await api("/api/auth/register", { method: "POST", body: JSON.stringify(payload) });

        data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }) });

function renderRecuperarSolicitar() {
  $app.innerHTML = `
    <div class="hero-login">
      <div class="hero-mark">${LOGO_SVG}</div>
      <div class="wordmark"><h1 style="font-size:22px;">Recuperar contraseña</h1></div>
      <p class="muted">Te enviamos un enlace a tu correo para elegir una nueva.</p>
    </div>
    <form class="login-form" id="recuperarForm">
      <div class="field"><label>Correo con el que te registraste</label><input type="email" name="email" placeholder="tucorreo@ejemplo.com" required></div>
      <button class="btn btn-primary" type="submit" style="margin-top:6px;">Enviar enlace de recuperación</button>
      <button type="button" class="link-btn" id="volverLoginBtn" style="margin-top:12px; width:100%; text-align:center;">‹ Volver a iniciar sesión</button>
    </form>
  `;
  document.getElementById("volverLoginBtn").onclick = () => { state.authMode = "login"; renderLogin(); };
  document.getElementById("recuperarForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = new FormData(e.target).get("email");
    const boton = e.target.querySelector("button[type=submit]");
    boton.disabled = true; boton.textContent = "Enviando…";
    try {
      const data = await api("/api/auth/forgot-password", { method: "POST", body: JSON.stringify({ email }) });
      state.recuperarEmail = email;
      if (data.modoSimulacion && data.resetToken) {
        // Sin servidor de correo configurado todavía: seguimos directo al
        // cambio de contraseña con el token que el backend nos devolvió.
        state.recuperarToken = data.resetToken;
        toast("Modo de prueba: sin correo configurado, seguimos directo al cambio de clave.");
      } else {
        state.recuperarToken = null;
        toast("Si el correo existe, te llegó un enlace para cambiar tu contraseña.");
      }
      state.authMode = "recuperar-cambiar";
      renderLogin();
    } catch (err) {
      toast(err.message);
      boton.disabled = false; boton.textContent = "Enviar enlace de recuperación";
    }
  };
}

/* ---- Recuperar contraseña: paso 2, definir la nueva ---- */
function renderRecuperarCambiar() {
  const tokenConocido = !!state.recuperarToken;
  $app.innerHTML = `
    <div class="hero-login">
      <div class="hero-mark">${LOGO_SVG}</div>
      <div class="wordmark"><h1 style="font-size:22px;">Nueva contraseña</h1></div>

    </div>
    <form class="login-form" id="cambiarForm">
      ${!tokenConocido ? `<div class="field"><label>Código de recuperación</label><input type="text" name="token" placeholder="Pega aquí el código del correo" required></div>` : ""}
      <div class="field"><label>Nueva contraseña</label><input type="password" name="password" placeholder="••••••••" minlength="6" required></div>

    </form>

  document.getElementById("volverLoginBtn2").onclick = () => { state.authMode = "login"; state.recuperarToken = null; renderLogin(); };
  document.getElementById("cambiarForm").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const token = state.recuperarToken || fd.get("token");
    const boton = e.target.querySelector("button[type=submit]");
    boton.disabled = true; boton.textContent = "Cambiando…";
    try {
      const data = await api("/api/auth/reset-password", { method: "POST", body: JSON.stringify({ token, password: fd.get("password") }) });
      state.recuperarToken = null; state.recuperarEmail = null;
      toast("Contraseña actualizada. ¡Ya entraste con la nueva!");
      await aplicarSesion(data);
    } catch (err) {
      toast(err.message);
      boton.disabled = false; boton.textContent = "Cambiar contraseña";
    }
  };
}

async function aplicarSesion(data) {
  state.token = data.token;
  state.usuario = data.usuario;
  state.role = data.usuario.role.toLowerCase();
  if (state.role === "comerciante") {
    try {
      const dir = await api("/api/comercios/publico");
      state.comercioInfo = dir.comercios.find((c) => c.id === state.usuario.comercioId) || { nombre: "Tu negocio", categoria: "" };
    } catch { state.comercioInfo = { nombre: "Tu negocio", categoria: "" }; }
    state.view = "dashboard";
  } else {
    state.view = "explorar";
  }
  render();
}

function cerrarSesion() {
  state.token = null; state.usuario = null; state.comercioInfo = null; state.role = null;
  state.comercioActivo = null; state.carrito = [];
  state.authMode = "login"; state.recuperarToken = null; state.recuperarEmail = null;
  renderLogin();
}

/* ============================== SHELL ============================== */
function shell(innerHTML, navItems, activeView) {
  const nombreArriba = state.role === "comerciante" ? (state.comercioInfo?.nombre || "Tu negocio") : state.usuario.nombre;
  const subArriba = state.role === "comerciante"
    ? (state.comercioInfo?.categoria || "Panel de comerciante")
    : (state.comercioActivo ? `Comprando en ${state.comercioActivo.nombre}` : "Cliente Tendia");
  const inicial = (nombreArriba || "T")[0].toUpperCase();
  const logoComercio = state.role === "comerciante" ? state.comercioInfo?.logo : null;

  return `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">${logoComercio ? `<img src="${logoComercio}" alt="">` : inicial}</div>
        <div>
          <div class="brand-name">${nombreArriba}</div>
          <div class="brand-sub">${subArriba}</div>
        </div>
      </div>
      <button class="session-chip" id="logoutBtn">Salir</button>
    </div>
    <div class="screen">${innerHTML}</div>
    <div class="bottomnav">
      ${navItems.map((n) => `
        <button class="navbtn ${activeView === n.id ? "active" : ""}" data-view="${n.id}">
          <span style="font-size:17px;">${n.icon}</span>
          <span>${n.label}</span>
        </button>`).join("")}
    </div>
  `;
}

function bindShell() {
  document.getElementById("logoutBtn").onclick = cerrarSesion;
  document.querySelectorAll(".navbtn").forEach((b) => {
    b.onclick = () => { state.view = b.dataset.view; render(); };
  });
}

async function viewDashboard() {

  bindShell();
  try {
    const [pedidosData, productosData] = await Promise.all([api("/api/pedidos"), api("/api/productos")]);
    const pedidos = pedidosData.pedidos;
    const activos = pedidos.filter((p) => ["nuevo", "proceso", "listo"].includes(p.estado));
    const entregados = pedidos.filter((p) => p.estado === "entregado");
    const ventasTotal = entregados.reduce((a, p) => a + p.total, 0);
    const ticketProm = entregados.length ? Math.round(ventasTotal / entregados.length) : 0;

    const porDia = {};
    entregados.forEach((p) => { const dia = p.createdAt.slice(0, 10); porDia[dia] = (porDia[dia] || 0) + p.total; });
    const dias = Object.keys(porDia).sort().slice(-7);

    const conteoProductos = {};
    pedidos.forEach((p) => {
      JSON.parse(p.items).forEach((it) => { conteoProductos[it.nombre] = (conteoProductos[it.nombre] || 0) + it.cantidad; });
    });
    const topProducto = Object.entries(conteoProductos).sort((a, b) => b[1] - a[1])[0];

    const html = `
      <div class="eyebrow">Resumen de tu negocio</div>

      <div class="card">
        <div class="logo-picker">

        <div class="kpi"><div class="lbl">Pedidos activos</div><div class="val">${activos.length}</div></div>
        <div class="kpi"><div class="lbl">Ticket promedio</div><div class="val">${fmt(ticketProm)}</div></div>
        <div class="kpi"><div class="lbl">Productos en catálogo</div><div class="val">${productosData.productos.length}</div></div>
      </div>

      ${dias.length ? `
        <div class="section-title"><h2>Ventas entregadas por día</h2></div>
        <div class="card"><canvas id="ventasChart"></canvas></div>
      ` : `<div class="section-title"><h2>Ventas por día</h2></div><div class="card"><p class="muted">Aún no tienes pedidos entregados para graficar.</p></div>`}

      <div class="section-title"><h2>Pedidos por atender</h2><button class="link-btn" data-goto="pedidos">Ver todos</button></div>
      <div class="card" style="padding:6px 16px;">
        ${activos.length === 0 ? `<p class="muted" style="padding:12px 0;">No tienes pedidos pendientes ahora mismo 🎉</p>` : activos.map((p) => `
          <div class="row" style="padding:11px 0; border-bottom:1px solid var(--line);">
            <div><div style="font-weight:700; font-size:13.5px;">${JSON.parse(p.items).map((i) => i.nombre).join(", ")}</div><div class="muted">${p.canal} · ${fmt(p.total)}</div></div>

    $app.innerHTML = shell(html, NAV_COMERCIANTE, "dashboard");

    document.getElementById("logoInput").onchange = async (e) => {

      if (!file) return;
      if (!["image/jpeg", "image/png"].includes(file.type)) { toast("Solo se aceptan imágenes JPG o PNG."); return; }
      if (file.size > 1.5 * 1024 * 1024) { toast("La imagen es muy pesada (máximo ~1.5MB)."); return; }

/** Convierte un <input type=file> en un selector con vista previa que
 *  guarda la imagen en base64 dentro de un <input type=hidden>. Valida
 *  formato (JPG/PNG) y tamaño (máx ~1.5MB) antes de leer el archivo. */
function bindImagePicker(labelEl) {
  const fileInputEl = labelEl.querySelector("input[type=file]");
  const hiddenInputEl = document.getElementById(fileInputEl.dataset.hiddenId);
  fileInputEl.onchange = () => {
    const file = fileInputEl.files[0];
    if (!file) return;
    if (!["image/jpeg", "image/png"].includes(file.type)) { toast("Solo se aceptan imágenes JPG o PNG."); fileInputEl.value = ""; return; }
    if (file.size > 1.5 * 1024 * 1024) { toast("La imagen es muy pesada (máximo ~1.5MB)."); fileInputEl.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      hiddenInputEl.value = reader.result;
      labelEl.innerHTML = "";
      const img = document.createElement("img");
      img.src = reader.result;
      labelEl.appendChild(img);
      labelEl.appendChild(fileInputEl);
      labelEl.classList.add("tiene-imagen");
    };
    reader.readAsDataURL(file);
  };
}

function thumbProducto(p) {

                ${p.precioAntes ? `<div class="price-before">${fmt(p.precioAntes)}</div>` : ""}

    $app.querySelectorAll(".img-picker label").forEach(bindImagePicker);

    const nuevoForm = document.getElementById("nuevoProdForm");
    if (nuevoForm) nuevoForm.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api("/api/productos", { method: "POST", body: JSON.stringify({
          nombre: fd.get("nombre"), categoria: fd.get("categoria") || undefined,
          precio: Math.round(Number(fd.get("precio")) * 100), precioAntes: fd.get("precioAntes") ? Math.round(Number(fd.get("precioAntes")) * 100) : undefined,
          promo: fd.get("promo") || undefined, stock: fd.get("stock") ? Number(fd.get("stock")) : 0,
          imagen1: fd.get("imagen1") || undefined, imagen2: fd.get("imagen2") || undefined,
        }) });
        toast("Producto creado.");
        state.mostrandoFormNuevoProducto = false;
        viewMenu();
      } catch (err) { toast(err.message); }
    };

    $app.querySelectorAll("[data-editar]").forEach((b) => b.onclick = () => { state.editandoProductoId = b.dataset.editar; viewMenu(); });
    $app.querySelectorAll("[data-canceleditar]").forEach((b) => b.onclick = () => { state.editandoProductoId = null; viewMenu(); });
    $app.querySelectorAll("[data-editform]").forEach((f) => f.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const payload = { precio: Math.round(Number(fd.get("precio")) * 100), stock: Number(fd.get("stock")) };
        if (fd.get("imagen1")) payload.imagen1 = fd.get("imagen1");
        if (fd.get("imagen2")) payload.imagen2 = fd.get("imagen2");
        await api(`/api/productos/${f.dataset.editform}`, { method: "PUT", body: JSON.stringify(payload) });
        toast("Producto actualizado.");
        state.editandoProductoId = null;
        viewMenu();
      } catch (err) { toast(err.message); }
    });

    $app.querySelectorAll("[data-borrar]").forEach((b) => b.onclick = async () => {
      if (state.confirmarBorrarId !== b.dataset.borrar) { state.confirmarBorrarId = b.dataset.borrar; viewMenu(); return; }
      try {
        await api(`/api/productos/${b.dataset.borrar}`, { method: "DELETE" });
        toast("Producto borrado.");
        state.confirmarBorrarId = null;
        viewMenu();
      } catch (err) { toast(err.message); }
    });
    $app.querySelectorAll("[data-cancelborrar]").forEach((b) => b.onclick = () => { state.confirmarBorrarId = null; viewMenu(); });
  } catch (err) {
    $app.innerHTML = shell(errorBox(err.message), NAV_COMERCIANTE, "menu");
    bindShell();
  }
}

async function exportarCRM() {
  try {
    const resp = await fetch(`${API_URL}/api/clientes/export/csv`, { headers: { Authorization: `Bearer ${state.token}` } });
    if (!resp.ok) throw new Error("No se pudo exportar el CRM.");
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "clientes_tendia.csv";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("CSV descargado con tu base de clientes real.");
  } catch (err) { toast(err.message); }
}

  bindShell();
  try {
    const { comercio, productos } = await api(`/api/productos/publico/${state.comercioActivo.id}`);
    const totalAhorro = productos.filter((p) => p.precioAntes).reduce((a, p) => a + (p.precioAntes - p.precio), 0);
    const html = `
      <button class="link-btn" id="cambiarComercio">‹ Cambiar de negocio</button>
      <div class="eyebrow">${comercio.categoria || ""}</div>
      <h2 style="font-size:20px;">${comercio.nombre}</h2>
      ${totalAhorro > 0 ? `
        <div class="card" style="background:var(--verde-pale); border:none;">
          <div class="row"><div><b style="color:var(--verde-deep);">Ahorro disponible hoy</b><div class="muted">En promociones activas</div></div>
          <div class="price-now" style="color:var(--verde-deep); font-size:17px;">${fmt(totalAhorro)}</div></div>
        </div>` : ""}

      <div class="section-title"><h2>Productos y servicios</h2></div>
      <div class="card">
        ${productos.length === 0 ? `<p class="muted" style="padding:10px 0;">Este negocio todavía no tiene productos cargados.</p>` : productos.map((p) => `
          <div class="prod">
            <div class="prod-thumb">${thumbProducto(p)}</div>
            <div class="prod-info">
              <div class="nm">${p.nombre}</div>
              <div class="cat">${p.categoria || ""}</div>
              ${p.promo ? `<span class="promo-tag">${p.promo}</span>` : ""}
            </div>
            <div class="price-block">
              <div class="price-now">${fmt(p.precio)}</div>
              ${p.precioAntes ? `<div class="price-before">${fmt(p.precioAntes)}</div>` : ""}
              <button class="btn btn-mango btn-sm" style="margin-top:6px;" data-add="${p.id}" data-nombre="${p.nombre}" data-precio="${p.precio}">Agregar</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    $app.innerHTML = shell(html, NAV_CLIENTE, "explorar");
    bindShell();
    document.getElementById("cambiarComercio").onclick = () => { state.comercioActivo = null; state.carrito = []; viewExplorar(); };
    $app.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => {
      const existente = state.carrito.find((i) => i.id === b.dataset.add);
      if (existente) existente.qty++;
      else state.carrito.push({ id: b.dataset.add, nombre: b.dataset.nombre, precio: Number(b.dataset.precio), qty: 1 });
      toast(`${b.dataset.nombre} agregado al pedido`);
    });
  } catch (err) {
    $app.innerHTML = shell(errorBox(err.message), NAV_CLIENTE, "explorar");
    bindShell();
  }
}

async function viewDirectorio() {
  $app.innerHTML = shell(cargando("Buscando negocios…"), NAV_CLIENTE, "explorar");
  bindShell();
  try {
    const { comercios } = await api("/api/comercios/publico");
    const html = `
      <div class="eyebrow">Directorio</div>
      <h2 style="font-size:20px;">¿En qué negocio quieres comprar?</h2>
      <div class="card">
        ${comercios.length === 0 ? `<p class="muted" style="padding:10px 0;">Todavía no hay comercios registrados en Tendia.</p>` : comercios.map((c) => `
          <div class="prod" style="cursor:pointer;" data-elegir="${c.id}" data-nombre="${c.nombre}">
            <div class="prod-thumb">${c.logo ? `<img src="${c.logo}" alt="">` : "🏬"}</div>
            <div class="prod-info"><div class="nm">${c.nombre}</div><div class="cat">${c.categoria || "Comercio"}</div></div>
          </div>
        `).join("")}

    `;
    $app.innerHTML = shell(html, NAV_CLIENTE, "explorar");
    bindShell();
    $app.querySelectorAll("[data-elegir]").forEach((el) => el.onclick = () => {
      state.comercioActivo = { id: el.dataset.elegir, nombre: el.dataset.nombre };
      state.carrito = [];
      viewExplorar();
    });
  } catch (err) {
    $app.innerHTML = shell(errorBox(err.message), NAV_CLIENTE, "explorar");
    bindShell();
  }
}

/* ======================= CLIENTE: CARRITO ======================= */
function viewCarrito() {
  const total = state.carrito.reduce((a, i) => a + i.precio * i.qty, 0);
  const html = `
    <div class="eyebrow">Tu pedido</div>
    <h2 style="font-size:20px;">Carrito</h2>
    ${state.carrito.length === 0 ? `
      <div class="empty"><div class="em-mark">🛒</div>Aún no has agregado nada.<br>Explora el menú para armar tu pedido.</div>
    ` : `
      <div class="card">
        ${state.carrito.map((i) => `
          <div class="cart-row">
            <div style="flex:1;"><div style="font-weight:700; font-size:13.5px;">${i.nombre}</div><div class="muted">${fmt(i.precio)} c/u</div></div>
            <div class="qty"><button data-dec="${i.id}">−</button><span>${i.qty}</span><button data-inc="${i.id}">+</button></div>
          </div>`).join("")}
        <div class="row" style="padding-top:14px;"><b>Total</b><span class="price-now" style="font-size:17px;">${fmt(total)}</span></div>
      </div>
      <button class="btn btn-verde" style="width:100%; margin-top:16px;" id="confirmarBtn">Confirmar pedido</button>
    `}
  `;
  $app.innerHTML = shell(html, NAV_CLIENTE, "carrito");
  bindShell();
  $app.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => { state.carrito.find((i) => i.id === b.dataset.inc).qty++; viewCarrito(); });
  $app.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => {
    const it = state.carrito.find((i) => i.id === b.dataset.dec);
    it.qty--; if (it.qty <= 0) state.carrito = state.carrito.filter((i) => i.id !== it.id);
    viewCarrito();
  });
  const cf = document.getElementById("confirmarBtn");
  if (cf) cf.onclick = async () => {
    cf.disabled = true; cf.textContent = "Enviando pedido…";
    try {
      const data = await api("/api/pedidos", { method: "POST", body: JSON.stringify({
        comercioId: state.comercioActivo.id, canal: "web",
        items: state.carrito.map((i) => ({ productoId: i.id, cantidad: i.qty })),
      }) });
      state.carrito = [];
      toast("Pedido enviado.");
      state.pedidoParaPagar = data.pedido.id;
      state.view = "pagar"; render();
    } catch (err) { toast(err.message); cf.disabled = false; cf.textContent = "Confirmar pedido"; }
  };
}

/* ======================= CLIENTE: MIS COMPRAS ======================= */
async function viewMisCompras() {
  $app.innerHTML = shell(cargando("Cargando tu historial…"), NAV_CLIENTE, "compras");
  bindShell();
  try {
    const { pedidos } = await api("/api/pedidos");
    const entregados = pedidos.filter((p) => p.estado === "entregado");
    const totalGastado = entregados.reduce((a, p) => a + p.total, 0);

    const porMes = {};
    entregados.forEach((p) => { const mes = p.createdAt.slice(0, 7); porMes[mes] = (porMes[mes] || 0) + p.total; });
    const meses = Object.keys(porMes).sort();

    const html = `
      <div class="eyebrow">Tu historial</div>
      <h2 style="font-size:20px;">Mis compras</h2>
      <div class="receipt" style="margin-top:16px;">
        <div class="eyebrow" style="text-align:center;">Resumen de cliente</div>
        <div class="kpi-grid" style="grid-template-columns:1fr 1fr;">
          <div><div class="lbl" style="font-size:10px; color:var(--slate); font-weight:700;">TOTAL GASTADO</div><div class="val" style="font-size:18px;">${fmt(totalGastado)}</div></div>
          <div><div class="lbl" style="font-size:10px; color:var(--slate); font-weight:700;">PEDIDOS ENTREGADOS</div><div class="val" style="font-size:18px;">${entregados.length}</div></div>
        </div>
      </div>

      ${meses.length ? `<div class="section-title"><h2>Compras por mes</h2></div><div class="card"><canvas id="clienteChart"></canvas></div>` : ""}

      <div class="section-title"><h2>Historial detallado</h2></div>
      <div class="card">
        ${pedidos.length === 0 ? `<p class="muted" style="padding:10px 0;">Todavía no has hecho ningún pedido.</p>` : pedidos.slice().reverse().map((p) => `
          <div class="row" style="padding:9px 0; border-bottom:1px solid var(--line);">
            <div><div style="font-weight:600; font-size:13px;">${JSON.parse(p.items).map((i) => i.nombre).join(", ")}</div><div class="muted">${p.createdAt.slice(0, 10)} · ${ETIQUETA_ESTADO[p.estado]} · ${ETIQUETA_PAGO[p.estadoPago]}</div></div>
            <div class="price-now">${fmt(p.total)}</div>
          </div>`).join("")}
      </div>
    `;
    $app.innerHTML = shell(html, NAV_CLIENTE, "compras");
    bindShell();
    if (meses.length) {
      new Chart(document.getElementById("clienteChart"), {
        type: "line",
        data: { labels: meses, datasets: [{ data: meses.map((m) => porMes[m]), borderColor: "#F2A93B", backgroundColor: "rgba(242,169,59,0.15)", fill: true, tension: 0.35, pointRadius: 3 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } }, responsive: true, maintainAspectRatio: false },
      });
    }
  } catch (err) {
    $app.innerHTML = shell(errorBox(err.message), NAV_CLIENTE, "compras");
    bindShell();
  }
}

/* ======================= CLIENTE: ESTADO DE PEDIDOS ======================= */
async function viewEstado() {
  $app.innerHTML = shell(cargando("Buscando tus pedidos…"), NAV_CLIENTE, "estado");
  bindShell();
  try {
    const { pedidos } = await api("/api/pedidos");
    const activos = pedidos.filter((p) => p.estado !== "entregado" && p.estado !== "cancelado");
    const html = `
      <div class="eyebrow">Seguimiento</div>
      <h2 style="font-size:20px;">Estado de tus pedidos</h2>
      ${activos.length === 0 ? `<div class="empty"><div class="em-mark">📦</div>No tienes pedidos en curso.</div>` : `
        <div class="card" style="padding:6px 16px;">
          ${activos.map((p) => `
            <div class="row" style="padding:12px 0; border-bottom:1px solid var(--line);">
              <div><div style="font-weight:700; font-size:13.5px;">${JSON.parse(p.items).map((i) => i.nombre).join(", ")}</div><div class="muted">${p.createdAt.slice(0, 16).replace("T", " ")} · ${p.canal}</div></div>
              <div style="text-align:right;">
                <div class="price-now" style="margin-bottom:5px;">${fmt(p.total)}</div>
                <span class="badge ${p.estado}">${ETIQUETA_ESTADO[p.estado]}</span>
                <div style="margin-top:4px;"><span class="badge ${CLASE_PAGO[p.estadoPago]}">${ETIQUETA_PAGO[p.estadoPago]}</span></div>
                ${(p.estadoPago === "pendiente" || p.estadoPago === "rechazado") && p.estado !== "cancelado" ? `<button class="btn btn-mango btn-sm" style="margin-top:6px;" data-pagar="${p.id}">${p.estadoPago === "rechazado" ? "Reintentar pago" : "Pagar"}</button>` : ""}
              </div>
            </div>`).join("")}
        </div>
      `}
    `;
    $app.innerHTML = shell(html, NAV_CLIENTE, "estado");
    bindShell();
    $app.querySelectorAll("[data-pagar]").forEach((b) => b.onclick = () => { state.pedidoParaPagar = b.dataset.pagar; state.view = "pagar"; render(); });
  } catch (err) {
    $app.innerHTML = shell(errorBox(err.message), NAV_CLIENTE, "estado");
    bindShell();
  }
}

/* ======================= CLIENTE: PAGAR UN PEDIDO ======================= */
async function viewPagarPedido() {
  const pedidoId = state.pedidoParaPagar;
  if (!pedidoId) { state.view = "estado"; return viewEstado(); }

  $app.innerHTML = shell(cargando("Cargando instrucciones de pago…"), NAV_CLIENTE, "estado");
  bindShell();
  try {
    const info = await api(`/api/pagos/pedido/${pedidoId}/instrucciones`);
    const metodoSel = state.metodoPagoElegido && info.metodos.some((m) => m.tipo === state.metodoPagoElegido) ? state.metodoPagoElegido : (info.metodos[0]?.tipo || null);
    const activo = info.metodos.find((m) => m.tipo === metodoSel);
    const bloqueado = info.estadoPago === "pagado" || info.estadoPago === "por_verificar";

    const filaDatos = (m) => {
      if (m.tipo === "pago_movil") return `<div class="muted">Banco: <b>${m.datos.banco}</b> · Tel: <b>${m.datos.telefono}</b> · C.I./RIF: <b>${m.datos.documento}</b></div>`;
      if (m.tipo === "zelle") return `<div class="muted">Correo/tel: <b>${m.datos.contacto}</b> · Titular: <b>${m.datos.titular}</b></div>`;
      return `<div class="muted">Pay ID: <b>${m.datos.payId}</b>${m.datos.nombre ? ` (${m.datos.nombre})` : ""}</div>`;
    };

    const html = `
      <button class="link-btn" id="volverEstado">‹ Volver a mis pedidos</button>
      <div class="eyebrow">Pagar pedido</div>
      <h2 style="font-size:20px;">${info.comercio.nombre}</h2>

      <div class="receipt" style="margin-top:14px;">
        <div class="eyebrow" style="text-align:center;">Total a pagar</div>
        <div style="text-align:center; margin-top:6px;">
          <div class="price-now" style="font-size:22px;">${fmt(info.totalUsd)}</div>
          ${info.totalBs ? `<div class="muted" style="margin-top:2px;">≈ ${fmtBs(info.totalBs)} · tasa BCV: ${info.tasaBs}</div>` : ""}
        </div>
      </div>

      ${info.pagos.length > 0 ? `
        <div class="section-title"><h2>Tus intentos de pago</h2></div>
        <div class="card">
          ${info.pagos.map((p) => `
            <div class="row" style="padding:8px 0; border-bottom:1px solid var(--line);">
              <div><div style="font-weight:600; font-size:13px;">${p.metodo.replace("_", " ")} · ref. ${p.referencia}</div>${p.motivoRechazo ? `<div class="muted" style="color:var(--clay);">${p.motivoRechazo}</div>` : ""}</div>
              <span class="badge ${p.estado === "aprobado" ? "listo" : p.estado === "rechazado" ? "cancelado" : "proceso"}">${p.estado === "por_verificar" ? "Por verificar" : p.estado === "aprobado" ? "Aprobado" : "Rechazado"}</span>
            </div>`).join("")}
        </div>
      ` : ""}

      ${bloqueado ? `
        <div class="card" style="margin-top:14px;">
          <p class="muted">${info.estadoPago === "pagado" ? "Este pedido ya está pagado. ✅" : "Tienes un pago en revisión. Espera la respuesta del comercio antes de declarar otro."}</p>
        </div>
      ` : info.metodos.length === 0 ? `
        <div class="card" style="margin-top:14px;"><p class="muted">Este negocio todavía no activó ningún método de pago en línea. Coordina el pago directamente con el comercio.</p></div>
      ` : `
        <div class="section-title"><h2>Elige cómo pagar</h2></div>
        <div class="role-toggle" style="height:auto; flex-wrap:wrap;">
          ${info.metodos.map((m) => `<button data-metodo="${m.tipo}" class="${metodoSel === m.tipo ? "active" : ""}" style="padding:10px 8px;">${m.nombre}</button>`).join("")}
        </div>

        ${activo ? `
          <div class="card" style="margin-top:12px;">
            <div style="font-weight:700; font-size:13.5px; margin-bottom:6px;">Paga ${activo.tipo === "pago_movil" ? fmtBs(activo.montoBs) : fmt(activo.montoUsd)} a:</div>
            ${filaDatos(activo)}
          </div>

          <div class="section-title"><h2>Ya pagué, reporto mi pago</h2></div>
          <div class="card">
            <form id="declararForm">
              <div class="field"><label>Número de referencia / confirmación</label><input name="referencia" required minlength="4" maxlength="40" placeholder="${activo.tipo === "pago_movil" ? "Ej: 004521" : activo.tipo === "zelle" ? "Ej: ZELLE-CONF-1234" : "Ej: ID de transacción Binance"}"></div>
              <div class="field" style="margin-top:10px;">
                <label>Captura del comprobante (opcional, JPG o PNG)</label>
                <div class="img-picker" style="margin-top:6px;"><label><input type="file" accept="image/jpeg,image/png" data-hidden-id="comprobanteInput"><span class="muted" style="font-size:11px;">+ Foto del comprobante</span></label></div>
                <input type="hidden" id="comprobanteInput" name="comprobante">
              </div>
              <button class="btn btn-verde" type="submit" style="margin-top:12px; width:100%;">Reporté mi pago</button>
            </form>
          </div>
        ` : ""}
      `}
    `;
    $app.innerHTML = shell(html, NAV_CLIENTE, "estado");
    bindShell();
    document.getElementById("volverEstado").onclick = () => { state.pedidoParaPagar = null; state.view = "estado"; render(); };

    $app.querySelectorAll("[data-metodo]").forEach((b) => b.onclick = () => { state.metodoPagoElegido = b.dataset.metodo; viewPagarPedido(); });
    $app.querySelectorAll(".img-picker label").forEach(bindImagePicker);

    const df = document.getElementById("declararForm");
    if (df) df.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const boton = e.target.querySelector("button[type=submit]");
      boton.disabled = true; boton.textContent = "Enviando…";
      try {
        await api(`/api/pagos/pedido/${pedidoId}/declarar`, { method: "POST", body: JSON.stringify({
          metodo: metodoSel, referencia: fd.get("referencia"),
          comprobante: fd.get("comprobante") || undefined,
          tasaBsVista: metodoSel === "pago_movil" ? info.tasaBs : undefined,
        }) });
        toast("¡Listo! Tu pago quedó registrado. El comercio lo va a verificar.");
        state.metodoPagoElegido = null;
        viewPagarPedido();
      } catch (err) { toast(err.message); boton.disabled = false; boton.textContent = "Reporté mi pago"; }
    };
  } catch (err) {
    $app.innerHTML = shell(errorBox(err.message), NAV_CLIENTE, "estado");
    bindShell();
  }
}

/* ============================== ROUTER ============================== */
function render() {
  if (!state.role) { renderLogin(); return; }
  if (state.role === "comerciante") {
    ({ dashboard: viewDashboard, menu: viewMenu, clientes: viewCRM, pedidos: viewPedidos, cobros: viewCobros, bot: viewBot })[state.view]();
  } else {
    ({ explorar: viewExplorar, carrito: viewCarrito, compras: viewMisCompras, estado: viewEstado, pagar: viewPagarPedido })[state.view]();
  }
}

// Si llegamos desde el enlace de un correo real (?resetToken=xxx), saltamos
// directo a la pantalla de "elegir nueva contraseña".
const tokenDeLaUrl = new URLSearchParams(window.location.search).get("resetToken");
if (tokenDeLaUrl) {
  state.authMode = "recuperar-cambiar";
  state.recuperarToken = tokenDeLaUrl;
}

renderLogin();



</script>
</body>
</html>
